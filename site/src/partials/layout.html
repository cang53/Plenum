<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#f4f5f7">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://plenumtool.eu{{path}}">
<link rel="canonical" href="https://plenumtool.eu{{path}}">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script>try{var t=localStorage.getItem("plenum-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="{{bodyClass}}">
<a class="skip" href="#main">Skip to content</a>
{{header}}
<main id="main">
{{main}}
</main>
{{footer}}
<script type="module" src="/assets/site.js"></script>
</body>
</html>
