name: Apply migrations

# Applies new files in supabase/migrations/ to the hosted Supabase project when they reach main.
# Needs the repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "scripts/db-align-history.sh", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: uwimagjkbwourvepvtns
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Align history (no-op once aligned)
        run: bash scripts/db-align-history.sh
      - name: Show what will run
        run: supabase db push --dry-run
      - name: Apply
        run: supabase db push --yes
