name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless (and saves image pulls).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Registries rate limit shared runners, so keep the Supabase images in the Actions cache.
      # Main saves them after a green run; pull requests restore main's copy.
      - name: Restore cached Supabase images
        id: images
        uses: actions/cache@v4
        with:
          path: ~/supabase-images.tar
          key: supabase-images-2.121.0-${{ hashFiles('supabase/config.toml') }}
      - name: Load cached Supabase images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i ~/supabase-images.tar
      - name: Log in to the image registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start local Supabase and export its keys
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          bash scripts/ci-supabase-start.sh
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          {
            echo "SUPABASE_URL=$(grep ^API_URL= "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep ^API_URL= "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep ^ANON_KEY= "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep ^SERVICE_ROLE_KEY= "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"
      - name: Save Supabase images for the cache
        if: steps.images.outputs.cache-hit != 'true'
        run: docker save -o ~/supabase-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '/supabase/' | sort -u)
      - name: Seed the local stack the way docs/local-run.md does (run twice to prove it is safe to re-run)
        run: |
          node scripts/seed-local.mjs seed-check@example.test
          node scripts/seed-local.mjs seed-check@example.test | grep -q 'Already seeded'
      - run: npm run test:e2e
        env:
          INBOUND_EMAIL_DOMAIN: in.plenum.example
          SES_INBOUND_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:plenum-inbound
          AWS_REGION: eu-west-1
          AUTH_PROVIDER: supabase
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
