# Local Supabase stack used by `supabase start` and the end-to-end tests (docs/e2e.md).
project_id = "plenum"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
# Access tokens last an hour; refresh tokens rotate so a stolen one stops working after one use.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_confirmations = false
